# Generates ServiceFlow.xcodeproj. Run `xcodegen` in this directory after
# adding or removing files; the .xcodeproj itself is not checked in.
name: ServiceFlow
options:
  bundleIdPrefix: com.ottawapainters
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.4"
    CURRENT_PROJECT_VERSION: "105"
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "9.32.0"
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"
  ServiceFlowKit:
    path: ServiceFlowKit
targets:
  ServiceFlow:
    type: application
    platform: iOS
    sources:
      - path: ServiceFlow
    dependencies:
      - package: Sentry
        product: Sentry
      - package: ServiceFlowKit
        product: ServiceFlowCore
      - package: Supabase
        product: Supabase
    settings:
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ottawapainters.app
        PRODUCT_NAME: ServiceFlow
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ServiceFlow/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ServiceFlow/Resources/ServiceFlow.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    postBuildScripts:
      - name: Upload Sentry debug symbols
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] && [ -f "$SRCROOT/Config/sentry-build-token" ]; then
            export SENTRY_AUTH_TOKEN="$(cat "$SRCROOT/Config/sentry-build-token")"
          fi
          if [ "$CONFIGURATION" = "Release" ] && [ -n "$SENTRY_AUTH_TOKEN" ]; then
            export SENTRY_ORG=serviceflowapp
            export SENTRY_PROJECT=serviceflow-ios
            export SENTRY_URL=https://us.sentry.io/
            # Preserve the regional URL instead of the token's global URL.
            export SENTRY_AUTH_TOKEN=" $SENTRY_AUTH_TOKEN"
            if command -v sentry-cli >/dev/null 2>&1; then
              sentry-cli debug-files upload "$DWARF_DSYM_FOLDER_PATH"
            else
              echo "error: Install sentry-cli to upload release debug symbols."
              exit 1
            fi
          fi
  ServiceFlowUITests:
    # Captures App Store screenshots; see ServiceFlowUITests/AppStoreScreenshots.swift.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ServiceFlowUITests
    dependencies:
      - target: ServiceFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ottawapainters.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ServiceFlow
        CODE_SIGN_STYLE: Automatic
schemes:
  ServiceFlow:
    build:
      targets:
        ServiceFlow: all
        ServiceFlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ServiceFlowUITests
    archive:
      config: Release

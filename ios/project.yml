# Generates ServiceFlow.xcodeproj. Run `xcodegen` in this directory after
# adding or removing files; the .xcodeproj itself is not checked in.
name: ServiceFlow
options:
  bundleIdPrefix: com.ottawapainters
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "101"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.30.0"
  ServiceFlowKit:
    path: ServiceFlowKit
targets:
  ServiceFlow:
    type: application
    platform: iOS
    sources:
      - path: ServiceFlow
    dependencies:
      - package: ServiceFlowKit
        product: ServiceFlowCore
      - package: Supabase
        product: Supabase
    settings:
      configs:
        Debug:
          APS_ENVIRONMENT: development
        Release:
          APS_ENVIRONMENT: production
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ottawapainters.app
        PRODUCT_NAME: ServiceFlow
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ServiceFlow/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ServiceFlow/Resources/ServiceFlow.entitlements
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
  ServiceFlowUITests:
    # Captures App Store screenshots; see ServiceFlowUITests/AppStoreScreenshots.swift.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ServiceFlowUITests
    dependencies:
      - target: ServiceFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ottawapainters.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ServiceFlow
        CODE_SIGN_STYLE: Automatic
schemes:
  ServiceFlow:
    build:
      targets:
        ServiceFlow: all
        ServiceFlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ServiceFlowUITests
    archive:
      config: Release
